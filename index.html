<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EBEEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="description" content="Mario Tennis の大会中に「今あなたが何をする番か」だけを表示する対戦進行アプリ。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="対戦ナビ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%BE%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%BE%3C/text%3E%3C/svg%3E">
<style>
  html{color-scheme:light dark}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>マリオテニス 対戦ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">

<style>
:root{
  --f-disp:"Archivo","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Archivo",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,monospace;

  --ground:#EBEEE7;
  --surface:#FBFCFA;
  --surface-2:#DFE4DA;
  --line:#C7CFC1;
  --line-strong:#A3AE9C;
  --ink:#12190F;
  --ink-2:#4F5A4C;
  --ink-3:#7C8878;

  --accent:#DED42B;
  --accent-ink:#191A03;
  --accent-edge:#B4AB18;

  --wait-bg:#2D3B47;
  --wait-ink:#E4EDF3;

  --ok:#2F7D4F;
  --bad:#B0402F;

  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1412; --surface:#18201B; --surface-2:#212B23;
    --line:#2E3A30; --line-strong:#3D4B3F;
    --ink:#EBF1E7; --ink-2:#9DAA99; --ink-3:#788574;
    --accent:#E4DC3E; --accent-ink:#15170A; --accent-edge:#8E8A1C;
    --wait-bg:#1E2A34; --wait-ink:#CEDCE6;
    --ok:#4CA36C; --bad:#D1604C;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1412; --surface:#18201B; --surface-2:#212B23;
  --line:#2E3A30; --line-strong:#3D4B3F;
  --ink:#EBF1E7; --ink-2:#9DAA99; --ink-3:#788574;
  --accent:#E4DC3E; --accent-ink:#15170A; --accent-edge:#8E8A1C;
  --wait-bg:#1E2A34; --wait-ink:#CEDCE6;
  --ok:#4CA36C; --bad:#D1604C;
}

*{box-sizing:border-box}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-disp);font-weight:800;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100vh}

.topbar{
  position:sticky;top:0;z-index:20;margin-inline:-16px;padding-inline:16px;
  background:var(--ground);border-bottom:1px solid var(--line);
}
.topbar-row{display:flex;align-items:center;gap:8px;min-height:48px}
.brand{
  font-family:var(--f-disp);font-weight:800;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}
.topbar-tools{margin-left:auto;display:flex;gap:6px}
.tool{
  border:1px solid var(--line);background:var(--surface);border-radius:7px;
  padding:5px 9px;font-size:12px;font-weight:700;color:var(--ink-2);line-height:1.2;
}
.tool:hover{border-color:var(--line-strong);color:var(--ink)}
.tool[disabled]{opacity:.35;cursor:default}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-bottom:10px;font-size:12.5px}
.crumb{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.crumb:last-child{color:var(--ink)}
.crumb-sep{color:var(--ink-3);font-family:var(--f-mono);font-size:11px}

/* ---------- turn banner ---------- */
.turn{margin-top:14px;border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.turn-kicker{font-family:var(--f-disp);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.turn-title{font-family:var(--f-disp);font-weight:800;font-size:25px;line-height:1.25}
.turn-note{font-size:13px;opacity:.78;margin-top:4px}
.turn.me{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-edge)}
.turn.them{background:var(--wait-bg);color:var(--wait-ink)}
.turn.calm{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* ---------- blocks ---------- */
.section{margin-top:22px}
.section-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.section-head h2{font-size:14px;letter-spacing:.04em}
.section-head .hint{font-size:12px;color:var(--ink-3);margin-left:auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-size:12.5px;font-weight:700;white-space:nowrap}
.kv dd{margin:0;font-weight:500}

/* ---------- choices ---------- */
.stack{display:flex;flex-direction:column;gap:10px}
.choice{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 16px;display:flex;align-items:center;gap:12px;
  transition:border-color .12s,transform .08s;
}
.choice:hover{border-color:var(--line-strong)}
.choice:active{transform:translateY(1px)}
.choice-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.choice-name{font-family:var(--f-disp);font-weight:800;font-size:17px}
.choice-sub{font-size:12px;color:var(--ink-3)}
.choice-tag{
  margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap;
}
.choice.fever{border-left:3px solid var(--accent-edge)}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-btn{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 12px;font-family:var(--f-disp);font-weight:800;font-size:22px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.big-btn small{font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--ink-3)}
.big-btn:hover{border-color:var(--line-strong)}
.big-btn.win{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.big-btn.win .label{color:var(--ok)}
.big-btn.lose{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.big-btn.lose .label{color:var(--bad)}

/* ---------- picture grid ---------- */
.grid{display:grid;gap:9px;grid-template-columns:repeat(2,1fr)}

.tile{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:center;
  transition:border-color .12s,transform .08s;
}
.tile:hover:not(:disabled){border-color:var(--line-strong)}
.tile:active:not(:disabled){transform:translateY(1px)}
.thumb{
  position:relative;aspect-ratio:384/247;width:100%;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.grid.gp .thumb{aspect-ratio:384/115}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tint,var(--line-strong))}
.tile-name{padding:7px 6px 8px;font-size:12px;font-weight:700;line-height:1.3;display:flex;align-items:center;justify-content:center;min-height:36px}
.tile[aria-pressed="true"]{border-color:var(--accent-edge);box-shadow:inset 0 0 0 2px var(--accent)}
.tile[aria-pressed="true"] .tile-name{background:var(--accent);color:var(--accent-ink)}
.tile:disabled{cursor:default}
.tile.off .thumb::after{
  content:attr(data-mark);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-disp);font-weight:800;font-size:13px;letter-spacing:.1em;
  color:var(--wait-ink);background:color-mix(in srgb,var(--wait-bg) 80%,transparent);
}
.tile.off .tile-name{color:var(--ink-3);text-decoration:line-through}
.tile.target{border-color:var(--accent-edge);box-shadow:0 0 0 1px var(--accent-edge)}
.badge{
  position:absolute;top:6px;left:6px;z-index:2;background:var(--accent);color:var(--accent-ink);
  font-family:var(--f-disp);font-weight:800;font-size:10px;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.35);
}

/* ---------- slots ---------- */
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.slot{
  flex:1 1 0;min-width:104px;border:1px dashed var(--line-strong);border-radius:8px;
  padding:9px 11px;font-size:13px;font-weight:700;color:var(--ink-3);
  display:flex;align-items:center;gap:8px;background:var(--surface);
}
.slot.filled{border-style:solid;border-color:var(--accent-edge);color:var(--ink)}
.slot.extra{border-color:var(--accent-edge)}
.slot-num{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);flex:none}
.slot .x{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}

/* ---------- order rail ---------- */
.rail{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.rail-item{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.rail-item:last-child{border-bottom:0}
.rail-n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:16px;flex:none}
.rail-who{
  font-family:var(--f-disp);font-weight:800;font-size:12px;letter-spacing:.06em;
  border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--ink-2);flex:none;
}
.rail-item.mine .rail-who{border-color:var(--accent-edge);color:var(--ink);background:color-mix(in srgb,var(--accent) 28%,transparent)}
.rail-tag{margin-left:auto;font-size:11px;font-weight:700;opacity:.72;flex:none}

/* ---------- chat box ---------- */
.chat{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.chat-label{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px 0}
.chat-text{padding:4px 12px 12px;font-family:var(--f-mono);font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.copy{width:100%;border:0;border-top:1px solid var(--line);background:var(--surface-2);padding:12px;font-weight:800;font-family:var(--f-disp);font-size:14px}
.copy:hover{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.copy.done{background:var(--accent);color:var(--accent-ink)}

/* ---------- input ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-3)}
#roomid{
  font-family:var(--f-mono);font-size:26px;letter-spacing:.34em;text-align:center;
  padding:12px 8px 12px 20px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--ground);color:var(--ink);width:100%;
}
#roomid:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

/* ---------- record rows ---------- */
.rec{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rec-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.rec-line{display:flex;align-items:center;gap:8px}
.rec-n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);flex:none;min-width:34px;white-space:nowrap}
.rec-line.group-start{margin-top:3px;padding-top:9px;border-top:1px dashed var(--line)}
.rec:last-child{border-bottom:0}
.rec-who{margin-top:7px;font-family:var(--f-disp);font-weight:800;font-size:12px;border:1px solid var(--line-strong);border-radius:4px;padding:1px 6px;color:var(--ink-2);flex:none}
.rec-who.self{border-color:var(--accent-edge);color:var(--ink);background:color-mix(in srgb,var(--accent) 28%,transparent)}
.rec-input{
  flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);
  background:var(--ground);border:1px solid var(--line);border-radius:7px;padding:8px 10px;
}
.rec-input::placeholder{color:var(--ink-3)}
.rec-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.rec-field{position:relative;flex:1;min-width:0;display:flex}
.rec-field .rec-input{flex:1;min-width:0}

/* 入力補完のドロップダウン */
.ac{
  position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:40;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;
  box-shadow:0 10px 26px rgba(0,0,0,.22);max-height:216px;overflow-y:auto;
  display:flex;flex-direction:column;padding:4px;
}
.ac-item{
  border:0;background:transparent;text-align:left;border-radius:6px;
  padding:9px 10px;font-size:14px;font-weight:500;line-height:1.3;color:var(--ink);
}
.ac-item:hover,.ac-item:focus{background:color-mix(in srgb,var(--accent) 34%,var(--surface))}
.ac-empty{padding:9px 10px;font-size:13px;color:var(--ink-3)}

/* ---------- sticky action ---------- */
.actionbar{
  position:sticky;bottom:0;z-index:15;margin-inline:-16px;margin-top:22px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--ground) 62%,color-mix(in srgb,var(--ground) 0%,transparent));
  display:flex;gap:10px;
}
.primary{
  flex:1;border:0;border-radius:var(--r);padding:16px;font-family:var(--f-disp);font-weight:800;font-size:17px;
  background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-edge);
}
.primary:disabled{opacity:.4;cursor:default}

/* ---------- history sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h2{font-size:17px}
.hist-match{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.hist-title{background:var(--surface-2);padding:8px 12px;font-family:var(--f-disp);font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.hist-body{padding:11px 13px;display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:13px;margin:0}
.hist-body dt{color:var(--ink-3);font-size:12px;font-weight:700;white-space:nowrap}
.hist-body dd{margin:0}
.pill{font-family:var(--f-disp);font-weight:800;font-size:11px;letter-spacing:.05em;border-radius:4px;padding:1px 6px;border:1px solid currentColor}
.muted{color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.65}

/* ---------- dialog ---------- */
.dlg-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--ground);border:1px solid var(--line);border-radius:14px;max-width:380px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg p{margin:0 0 18px;font-size:14.5px;line-height:1.65}
.dlg-row{display:flex;gap:10px}
.dlg-row button{flex:1;border-radius:9px;padding:13px;font-family:var(--f-disp);font-weight:800;font-size:15px}
.dlg-no{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2)}
.dlg-yes{border:0;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-edge)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<div id="modal"></div>

<script>
/* 「使用コート一覧」から切り出した画像

const RACKET_NAMES = nameList(RACKETS);

const RULES = {
  "classic-singles": { name:"クラシックシングルス", doubles:false, fever:false },
  "classic-doubles": { name:"クラシックダブルス",   doubles:true,  fever:false },
  "fever-singles":   { name:"フィーバーシングルス", doubles:false, fever:true  },
  "fever-doubles":   { name:"フィーバーダブルス",   doubles:true,  fever:true  }
};

/* コート選択の順番
   1戦目: 1P 1BAN → 2P 2BAN → 1P 決定
   2戦目: 1P（前戦の勝者）2BAN → 2P 決定
   3戦目: 1P（2戦目の勝者）2BAN ＋ 1戦目のコート枠を任意で3つ目に追加BAN → 2P 決定 */
function courtSteps(i){
  if(i===0) return [
    { actor:"1P", type:"ban", count:1 },
    { actor:"2P", type:"ban", count:2 },
    { actor:"1P", type:"pick" }
  ];
  if(i===1) return [
    { actor:"1P", type:"ban", count:2 },
    { actor:"2P", type:"pick" }
  ];
  return [
    { actor:"1P", type:"ban", count:2, extra:true },
    { actor:"2P", type:"pick" }
  ];
}

/* キャラクターピックの順番（案内表示のみ） */
function charSteps(i){
  if(i===0) return [
    { actor:"1P", what:"初期選択" }, { actor:"2P", what:"初期選択" },
    { actor:"1P", what:"変更"     }, { actor:"2P", what:"変更"     },
    { actor:"1P", what:"初期に戻す" }, { actor:"2P", what:"初期に戻す" }
  ];
  return [ { actor:"1P", what:"選択" }, { actor:"2P", what:"選択" } ];
}

const KEY = "mt-navi-v6";
let S, undoStack = [], sheet = null, copied = "", dialog = null;

/* アーティファクト内では window.confirm が使えないことがあるため、自前のダイアログを使う */
function ask(msg, onOk, okLabel){
  dialog = { msg, onOk, okLabel: okLabel || "OK" };
  renderDialog();
}
function renderDialog(){
  const el = document.getElementById("modal");
  if(!dialog){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="dlg-bg" data-act="dlg-no">
    <div class="dlg" data-stop="1">
      <p>${String(dialog.msg).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]))}</p>
      <div class="dlg-row">
        <button class="dlg-no" data-act="dlg-no">キャンセル</button>
        <button class="dlg-yes" data-act="dlg-yes">${dialog.okLabel}</button>
      </div></div></div>`;
}

function blankState(){
  return { screen:"rule", rule:null, firstSide:null, roomId:"", matches:[], cur:0, finished:false };
}
function newMatch(side){
  return {
    side, phase:"court",
    courtStep:0, banDraft:[], bans:[], court:null,
    chars:{ "1P":["","","",""], "2P":["","","",""] },
    rackets:{ "1P":["","","",""], "2P":["","","",""] },
    result:null
  };
}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function snapshot(){ undoStack.push(JSON.stringify(S)); if(undoStack.length>60) undoStack.shift(); }
function undo(){ if(!undoStack.length) return; S = JSON.parse(undoStack.pop()); copied=""; save(); render(); }

   派生
   ========================================================================== */

const rule      = ()=> RULES[S.rule];
const match     = ()=> S.matches[S.cur];
const isMe      = (m,actor)=> actor === m.side;
const frame     = id => COURTS.find(c=>c.id===id) || {};
const frameName = id => frame(id).name || "—";
const pickCourt = id => PICK_COURTS.find(c=>c.id===id) || {};
const pickName  = id => pickCourt(id).name || "—";
const frameOf   = id => pickCourt(id).frame;

const bannedFrames = m => m.bans.map(b=>b.id);
/* 記録欄（配列）を表示用の1行にする */
const showRec = (arr, join) => (arr||[]).map(s=>String(s||"").trim()).filter(Boolean).join(join);
const showChars   = arr => showRec(arr, " × ");
const showRackets = arr => showRec(arr, "、");
/* 追加BANの対象は「1戦目で使ったコートの枠」。ハードで戦ったならハード枠＝両方のハード。 */
function extraBanTarget(){ const m1 = S.matches[0]; return m1 && m1.court ? frameOf(m1.court) : null; }
function needsResult(i){ return i < 2; }
function myWins(){ return S.matches.filter(m=>m.result==="win").length; }

/* ==========================================================================
   描画ヘルパ

const esc = s => String(s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function tile({img,name,tint,act,pressed,disabled,off,target,badge,mark}){
  return `<button class="tile ${off?"off":""} ${target?"target":""}" data-act="${esc(act)}"
    aria-pressed="${pressed?"true":"false"}" ${disabled?"disabled":""}>
    ${badge?`<span class="badge">${esc(badge)}</span>`:""}
    <span class="thumb" data-mark="${esc(mark||"BAN")}">${img?`<img src="${img}" alt="">`:""}
      ${tint?`<span class="thumb-bar" style="--tint:${tint}"></span>`:""}</span>
    <span class="tile-name">${esc(name)}</span></button>`;
}
function chatBox(label, text, id, confirmMsg){
  const done = copied === id;
  return `<div class="chat"><div class="chat-label">${esc(label)}</div>
    <div class="chat-text">${esc(text)}</div>
    <button class="copy ${done?"done":""}" data-copy="${esc(id)}" data-text="${esc(text)}"
      ${confirmMsg?`data-confirm="${esc(confirmMsg)}"`:""}>
      ${done ? "コピーしました" : "この文章をコピー"}</button></div>`;
}
function turnBanner(mode, kicker, title, note){
  return `<div class="turn ${mode}"><span class="turn-kicker">${esc(kicker)}</span>
    <span class="turn-title">${esc(title)}</span>
    ${note?`<span class="turn-note">${esc(note)}</span>`:""}</div>`;
}
function actionBar(main, extra){ return `<div class="actionbar">${extra||""}${main||""}</div>`; }
function slot(label, value, act, cls){
  return `<div class="slot ${value?"filled":""} ${cls||""}" ${value?`data-act="${act}"`:""}>
    <span class="slot-num">${esc(label)}</span>${value?esc(value):"未選択"}${value?`<span class="x">×</span>`:""}</div>`;
}

function crumbList(){
  if(S.screen==="rule") return ["ルール選択"];
  if(S.screen==="side") return ["1P / 2P 選択"];
  if(S.screen==="room") return ["ルーム作成"];
  if(S.screen==="end")  return ["対戦終了"];

  const m = match(), n = `${S.cur+1}戦目`;
  if(m.phase==="court"){
    const st = courtSteps(S.cur)[m.courtStep], mine = isMe(m,st.actor);
    const what = st.type==="pick" ? "コート決定" : "BAN";
    return [n,"コート選択", mine ? `自分の${what}` : `相手の${what}待ち`];
  }
  if(m.phase==="chars")   return [n,"キャラクターピック"];
  if(m.phase==="rackets") return [n,"フィーバーラケット選択"];
  if(m.phase==="play")    return [n,"試合中"];
  return [n,"結果入力"];
}

function topbar(){
  const c = crumbList().map(x=>`<span class="crumb">${esc(x)}</span>`)

  return `<div class="topbar">
    <div class="topbar-row">
      <span class="brand">Mario Tennis / 対戦ナビ</span>
      <div class="topbar-tools">
        <button class="tool" data-act="undo" ${undoStack.length?"":"disabled"}>戻る</button>
        <button class="tool" data-act="history" ${S.screen!=="rule"?"":"disabled"}>履歴</button>
        <button class="tool" data-act="reset">新規</button>
      </div>
    </div><div class="crumbs">${c}</div></div>`;
}

/* ==========================================================================
   フェーズ: コート選択
   ========================================================================== */

function banLogBlock(m){
  const banned = bannedFrames(m);
  if(!banned.length) return "";
  const left = PICK_COURTS.filter(c=>!banned.includes(c.frame)).length;
  return `<div class="section"><div class="section-head"><h2>BAN状況</h2>
      <span class="hint">残り ${left} コート</span></div>
    <div class="card"><dl class="kv">${
      ["1P","2P"].map(p=>{
        const l = m.bans.filter(b=>b.by===p);
        return l.length ? `<dt>${p}${p===m.side?"（自分）":""}</dt>
          <dd>${l.map(b=>frameName(b.id)+(b.extra?"（追加BAN）":"")).join("、")}</dd>` : "";
      }).join("")}</dl></div></div>`;
}

function courtPhase(){
  const m = match(), steps = courtSteps(S.cur), st = steps[m.courtStep];
  const mine = isMe(m, st.actor), banned = bannedFrames(m);

  /* --- BAN（3戦目は1戦目のコート枠を3つ目として同じ画面で選べる）--- */
  if(st.type === "ban"){
    const target = st.extra ? extraBanTarget() : null;
    const draft  = m.banDraft;
    const normal = draft.filter(x=>x!==target);
    const hasExtra = target && draft.includes(target);

    const grid = COURTS.map(c=>{
      const isBanned = banned.includes(c.id);
      const isTarget = c.id === target;
      return tile({ img:FRAME_IMG[c.id], name:c.name, tint:c.tint,
        act:`ban:${c.id}`, pressed:draft.includes(c.id),
        disabled:isBanned, off:isBanned,
        target:isTarget && !isBanned,
        badge:isTarget && !isBanned ? "追加BAN可" : "" });
    }).join("");

    const slots = st.extra
      ? slot("1", normal[0] ? frameName(normal[0]) : "", `ban-off:${normal[0]}`)
        + slot("2", normal[1] ? frameName(normal[1]) : "", `ban-off:${normal[1]}`)
        + slot("追加", hasExtra ? frameName(target) : "", `ban-off:${target}`, "extra")
      : Array.from({length:st.count},(_,i)=>
          slot(String(i+1), draft[i] ? frameName(draft[i]) : "", `ban-off:${draft[i]}`)).join("");

    const ready = normal.length === st.count;
    const text  = draft.length ? `${draft.map(frameName).join("、")}をBANします。` : "";
    const chat  = mine && ready
      ? chatBox("チャット文", text, "ban",
          st.extra && !hasExtra
            ? `1戦目のコート（${frameName(target)}）を追加BANしていません。このままコピーしますか？`
            : "")
      : "";

    const note = st.extra
      ? (mine
          ? `BANするコートを2つ選んでください。1戦目で使った「${frameName(target)}」は3つ目として追加BANできます（任意）。`
          : `相手のBAN（2〜3つ）をTonamelで確認して、下で記録してください。1戦目の「${frameName(target)}」が追加BANされている場合があります。`)
      : (mine ? `BANするコートを${st.count}つ選択してください。`
              : `相手のBAN（${st.count}つ）をTonamelで確認して、下で記録してください。`);

    return turnBanner(mine?"me":"them","コート選択",
        mine?"あなたがBANする番です":"相手がBANする番です", note)
      + `<div class="section"><div class="section-head">
          <h2>${mine?"BANするコート":"相手のBANを記録"}</h2>
          <span class="hint">${draft.length} / ${st.extra ? st.count+"〜"+(st.count+1) : st.count}</span></div>
          <div class="slots">${slots}</div>
          <div class="grid">${grid}</div>${chat}</div>`
      + banLogBlock(m)
      + actionBar(`<button class="primary" data-act="ban-done" ${ready?"":"disabled"}>${
          mine ? (st.extra && hasExtra ? "3コートまとめてBAN" : "BANを確定") : "確認した"}</button>`);
  }

  /* --- コート決定（アカデミー / スタジアムまで選ぶ）--- */
  const grid = PICK_COURTS.map(c=>{
    const isBanned = banned.includes(c.frame);
    return tile({ img:PICK_IMG[c.id], name:c.name, tint:frame(c.frame).tint,
      act:`court:${c.id}`, pressed:m.court===c.id, disabled:isBanned, off:isBanned });
  }).join("");
  const chat = (mine && m.court) ? chatBox("チャット文", `${pickName(m.court)}でお願いします。`, "court") : "";

  return turnBanner(mine?"me":"them","コート選択 ＞ 決定",
      mine?"あなたがコートを決める番です":"相手のコート決定待ちです",
      mine?"残ったコートから1つ選んでください。アカデミーとスタジアムも分けて選べます。"
          :"相手が決めたコートをTonamelで確認して、下で記録してください。")
    + `<div class="section"><div class="section-head"><h2>${mine?"使用するコート":"相手が決めたコート"}</h2></div>
        <div class="grid gp">${grid}</div>${chat}</div>`
    + banLogBlock(m)
    + actionBar(`<button class="primary" data-act="court-done" ${m.court?"":"disabled"}>
        ${mine?"このコートに決定":"確認した"}</button>`);
}

/* ==========================================================================
   案内フェーズ（キャラクター / ラケット）— 順番の案内＋自由入力の記録
   ========================================================================== */

function guidePhase(cfg){
  const m = match();

  const rail = cfg.steps.map((s,i)=>{
    const mine = isMe(m, s.actor);
    return `<div class="rail-item ${mine?"mine":""}">
      <span class="rail-n">${i+1}</span><span class="rail-who">${s.actor}</span>
      <span class="rail-what">${esc(s.what)}</span>
      ${mine?`<span class="rail-tag">あなた</span>`:""}</div>`;
  }).join("");

  const rec = ["1P","2P"].map(p=>{
    const vals = cfg.store(m)[p];
    const lines = Array.from({length:cfg.count},(_,k)=>`
      <div class="rec-line ${cfg.groups && k>0 && k%cfg.groups===0 ? "group-start" : ""}">
        ${cfg.count>1?`<span class="rec-n">${esc(cfg.labels[k])}</span>`:""}
        <div class="rec-field">
          <input class="rec-input" id="rec-${cfg.key}-${p}-${k}" data-rec="${cfg.key}:${p}:${k}"
            autocomplete="off" autocorrect="off" spellcheck="false"
            placeholder="${esc(cfg.placeholder)}" value="${esc(vals[k]||"")}">
          <div class="ac" hidden></div>
        </div>
      </div>`).join("");
    return `<div class="rec">
      <span class="rec-who ${p===m.side?"self":""}">${p}${p===m.side?" 自分":""}</span>
      <div class="rec-list">${lines}</div>
    </div>`;
  }).join("");

  return turnBanner("calm",`${S.cur+1}戦目 ・ ${cfg.label}選択`, cfg.title, cfg.note)
    + `<div class="section"><div class="section-head"><h2>選択順</h2>
        <span class="hint">${esc(cfg.orderHint)}</span></div><div class="rail">${rail}</div></div>`
    + `<div class="section"><div class="section-head"><h2>記録</h2><span class="hint">任意</span></div>
        <div class="card" style="padding:0">${rec}</div>
        <p class="note">入力しなくても次へ進めます。履歴に残したいときだけ書いてください。</p></div>`
    + actionBar(`<button class="primary" data-act="${cfg.doneAct}">${esc(cfg.doneLabel)}</button>`);
}

function charCfg(){
  const i = S.cur, dbl = rule().doubles;
  return {
    key:"chars", label:"キャラクター", title:"この順番でキャラクターを選びます",
    note: i===0
      ? "1戦目は被せ合いありです。①②で初期選択、③④で変更、⑤⑥で初期に戻すかどうかを決めます。相手の選択はTonamelで確認してください。"
      : "2戦目以降は被せ合いなしです。1P → 2P の順に選択します。",
    orderHint: i===0 ? "被せ合いあり" : "被せ合いなし",
    steps: charSteps(i), store: m=>m.chars,
    count: dbl ? 2 : 1, labels:["1体目","2体目"], join:" × ",
    options: CHAR_NAMES, placeholder:"入力して選ぶ（例：マリオ）",
    doneAct:"chars-done",
    doneLabel: rule().fever ? "ラケット選択へ" : "キャラ選択が終わった"
  };
}

function racketCfg(){
  return {
    key:"rackets", label:"フィーバーラケット", title:"この順番でラケットを選びます",
    note:"① 1Pが1本 → ② 2Pが2本 → ③ 1Pが1本の順です。相手と同じラケットを選べます。自分が1本目に選んだラケットは選べません。",
    orderHint:"1P → 2P → 1P",
    steps: RACKET_STEPS.map(s=>({ actor:s.actor, what:`ラケットを${s.count}本選択` })),
    store: m=>m.rackets,
    /* 1人につき2本。ダブルスは2人 × 2本 = 1チーム4枠 */
    count: rule().doubles ? 4 : 2, groups: 2,
    labels: rule().doubles
      ? ["1人目 1本目","1人目 2本目","2人目 1本目","2人目 2本目"]
      : ["1本目","2本目"],
    join:"、",
    options: RACKET_NAMES, placeholder:"入力して選ぶ（例：ファイア）",
    doneAct:"rackets-done", doneLabel:"ラケット選択が終わった"
  };
}

    + `<div class="section">${chatBox("チャット文","ありがとうございました。","bye")}</div>`
    + `<div class="section"><button class="choice" data-act="history">
        <span class="choice-main"><span class="choice-name">対戦履歴を見る</span>
        <span class="choice-sub">コート・キャラクター・ラケットの記録</span></span></button></div>`
    + actionBar(`<button class="primary" data-act="reset">新しい対戦を始める</button>`);
}

function screenMatch(){
  const m = match();
  if(m.phase==="court")   return courtPhase();
  if(m.phase==="chars")   return guidePhase(charCfg());
  if(m.phase==="rackets") return guidePhase(racketCfg());
  if(m.phase==="play")    return playPhase();
  return resultPhase();
}

/* ==========================================================================
   履歴
   ========================================================================== */

function renderSheet(){
  const el = document.getElementById("sheet");
  if(sheet !== "history"){ el.innerHTML = ""; return; }
  const r = rule(), dash = "<span class='muted'>—</span>";
  const head = `<div class="card"><dl class="kv">
      <dt>ルール</dt><dd>${esc(r.name)}</dd>
      ${S.roomId?`<dt>ルームID</dt><dd style="font-family:var(--f-mono);letter-spacing:.1em">${esc(S.roomId)}</dd>`:""}
    </dl></div>`;

  const body = S.matches.map((m,i)=>{
    const bans = ["1P","2P"].map(p=>{
      const l = m.bans.filter(b=>b.by===p);
      return l.length ? `<dt>${p} BAN</dt><dd>${l.map(b=>frameName(b.id)+(b.extra?"（追加）":"")).join("、")}</dd>` : "";
    }).join("");
    return `<div class="hist-match">
      <div class="hist-title">${i+1}戦目 <span class="pill" style="color:var(--ink-3)">自分 ${m.side}</span></div>
      <dl class="hist-body">
        ${bans}
        <dt>決定コート</dt><dd>${m.court?esc(pickName(m.court)):dash}</dd>
        <dt>1P キャラ</dt><dd>${showChars(m.chars["1P"])?esc(showChars(m.chars["1P"])):dash}</dd>
        <dt>2P キャラ</dt><dd>${showChars(m.chars["2P"])?esc(showChars(m.chars["2P"])):dash}</dd>
        ${r.fever?`<dt>1P ラケット</dt><dd>${showRackets(m.rackets["1P"])?esc(showRackets(m.rackets["1P"])):dash}</dd>`:""}
        ${r.fever?`<dt>2P ラケット</dt><dd>${showRackets(m.rackets["2P"])?esc(showRackets(m.rackets["2P"])):dash}</dd>`:""}
      </dl></div>`;
  }).join("");

  el.innerHTML = `<div class="sheet-bg" data-act="sheet-close">
    <div class="sheet" data-stop="1">
      <div class="sheet-head"><h2>対戦履歴</h2>
        <button class="tool" data-act="sheet-close" style="margin-left:auto">閉じる</button></div>
      ${head}${body || `<p class="note">まだ記録がありません。</p>`}
      <p class="note">勝敗は次の試合の1P / 2P を決めるためだけに使うため、履歴には残していません。</p>
    </div></div>`;
}

/* ==========================================================================
   操作
   ========================================================================== */

function advanceCourt(){
  const m = match();
  m.courtStep++; m.banDraft = [];
  if(m.courtStep >= courtSteps(S.cur).length) m.phase = "chars";
}

/* 新しい対戦：保存データを消してルール選択からやり直す */
function startNew(){
  undoStack = []; sheet = null; dialog = null; copied = "";
  S = blankState();
  try{ localStorage.removeItem(KEY); }catch(e){}
  save(); render();
}

function handle(act){
  const m = S.matches[S.cur];

  if(act === "undo"){ undo(); return; }
  if(act === "history"){ sheet = "history"; renderSheet(); return; }
  if(act === "sheet-close"){ sheet = null; renderSheet(); return; }
  if(act === "dlg-no"){ dialog = null; renderDialog(); return; }
  if(act === "dlg-yes"){ const d = dialog; dialog = null; renderDialog(); if(d) d.onOk(); return; }
  if(act === "reset"){
    /* 対戦が終わっている／まだ始めていないときは確認なしで新規対戦へ */
    if(S.screen === "rule" || S.screen === "end"){ startNew(); return; }
    ask("進行中の対戦データを消して、新しい対戦を始めますか？", startNew, "新しい対戦を始める");
    return;
  }

  snapshot(); copied = "";

  if(act.startsWith("rule:")){ S.rule = act.slice(5); S.screen = "side"; }
  else if(act.startsWith("side:")){
    S.firstSide = act.slice(5);
    S.matches = [newMatch(S.firstSide)]; S.cur = 0; S.screen = "room";
  }
  else if(act === "room-done"){ S.screen = "match"; }

  /* コート */
  else if(act.startsWith("ban:")){
    const id = act.slice(4), st = courtSteps(S.cur)[m.courtStep];
    const target = st.extra ? extraBanTarget() : null;
    if(m.banDraft.includes(id)) m.banDraft = m.banDraft.filter(x=>x!==id);
    else if(id === target) m.banDraft.push(id);
    else if(m.banDraft.filter(x=>x!==target).length < st.count) m.banDraft.push(id);
  }
  else if(act.startsWith("ban-off:")){
    const id = act.slice(8);
    m.banDraft = m.banDraft.filter(x=>x!==id);
  }
  else if(act === "ban-done"){
    const st = courtSteps(S.cur)[m.courtStep];
    const target = st.extra ? extraBanTarget() : null;
    m.banDraft.forEach(id=> m.bans.push({ by:st.actor, id, extra: id === target }));
    advanceCourt();
  }
  else if(act.startsWith("court:")){ m.court = act.slice(6); }
  else if(act === "court-done"){ advanceCourt(); }

  else if(act === "chars-done"){ m.phase = rule().fever ? "rackets" : "play"; }
  else if(act === "rackets-done"){ m.phase = "play"; }

  /* 試合・結果 */
  else if(act === "play-done"){
    if(needsResult(S.cur)) m.phase = "result";
    else { S.finished = true; S.screen = "end"; }
  }
  else if(act.startsWith("result:")){
    m.result = act.slice(7);
    const nextSide = m.result === "win" ? "1P" : "2P";
    if(S.cur === 0){ S.matches.push(newMatch(nextSide)); S.cur = 1; }
    else if(myWins() === 1){ S.matches.push(newMatch(nextSide)); S.cur = 2; }
    else { S.finished = true; S.screen = "end"; }
  }

  save(); render();
}

/* ==========================================================================
   コピー / 描画
   ========================================================================== */

async function copyText(id, text){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  if(!ok){
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy"); ta.remove();
    } catch(e){}
  }
  if(ok){ copied = id; render(); setTimeout(()=>{ if(copied===id){ copied=""; render(); } }, 2200); }
}

/* ==========================================================================
   記録欄の入力補完（絞り込みドロップダウン）
   ========================================================================== */

/* ひらがなをカタカナに寄せて比較する（「まりお」でも「マリオ」が出るように） */
const norm = s => String(s).replace(/[ぁ-ゖ]/g,
  c => String.fromCharCode(c.charCodeAt(0) + 0x60)).toLowerCase();

/* 1枠 = 1体 / 1本。重複の制限はしない。 */
const acOptions = key => key === "rackets" ? RACKET_NAMES : CHAR_NAMES;
function acTarget(inp){
  const [key, side, k] = inp.dataset.rec.split(":");
  return { key, side, idx:+k };
}

function closeAC(inp){
  const box = inp.parentElement && inp.parentElement.querySelector(".ac");
  if(box) box.hidden = true;
}
function openAC(inp){
  const box = inp.parentElement.querySelector(".ac");
  const { key } = acTarget(inp);
  const opts = acOptions(key), value = inp.value.trim(), q = norm(value);
  /* 候補どおり入力済みなら閉じる */
  if(opts.includes(value)){ box.hidden = true; return; }
  const list = opts.filter(o => !q || norm(o).includes(q));
  if(!list.length){ box.hidden = true; return; }
  box.innerHTML = list.map(o =>
    `<button type="button" class="ac-item" data-val="${esc(o)}">${esc(o)}</button>`).join("");
  box.hidden = false;
}
function applyAC(inp, val){
  const { key, side, idx } = acTarget(inp);
  inp.value = val;
  match()[key][side][idx] = val;
  save();
  closeAC(inp);
  inp.blur();
}
function wireAC(){
  document.querySelectorAll(".rec-input").forEach(inp=>{
    inp.addEventListener("focus", ()=>openAC(inp));
    inp.addEventListener("input", ()=>openAC(inp));
    inp.addEventListener("blur",  ()=>setTimeout(()=>closeAC(inp), 160));
    inp.addEventListener("keydown", e=>{
      if(e.key === "Escape"){ closeAC(inp); e.target.blur(); }
      if(e.key === "Enter"){
        const first = inp.parentElement.querySelector(".ac:not([hidden]) .ac-item");
        if(first){ e.preventDefault(); applyAC(inp, first.dataset.val); }
        else inp.blur();
      }
    });
  });
}
document.addEventListener("mousedown", e=>{
  const it = e.target.closest(".ac-item");
  if(!it) return;
  e.preventDefault();                       /* blur より先に確定させる */
  applyAC(it.closest(".rec-field").querySelector(".rec-input"), it.dataset.val);
});

/* ==========================================================================
   描画
   ========================================================================== */

function render(){
  const body =
    S.screen === "rule" ? screenRule() :
    S.screen === "side" ? screenSide() :
    S.screen === "room" ? screenRoom() :
    S.screen === "end"  ? screenEnd()  : screenMatch();
  document.getElementById("app").innerHTML = topbar() + body;
  renderSheet();
  renderDialog();
  wireAC();
}

document.addEventListener("click", e=>{
  const copyBtn = e.target.closest("[data-copy]");
  if(copyBtn){
    const c = copyBtn.dataset.confirm, id = copyBtn.dataset.copy, t = copyBtn.dataset.text;
    if(c) ask(c, ()=>copyText(id, t), "このままコピー");
    else copyText(id, t);
    return;
  }
  const el = e.target.closest("[data-act]");
  if(!el || el.disabled) return;
  const a = el.dataset.act;
  if((a === "sheet-close" || a === "dlg-no") && e.target.closest("[data-stop]") && !e.target.closest("button")) return;
  handle(a);
});

document.addEventListener("input", e=>{
  if(e.target.id === "roomid"){
    S.roomId = e.target.value.replace(/[^0-9A-Za-z]/g,"").slice(0, ROOM_ID_LEN);
    if(S.roomId !== e.target.value) e.target.value = S.roomId;
    save();
    if(S.roomId.length === ROOM_ID_LEN) render();
    return;
  }
  const rec = e.target.dataset && e.target.dataset.rec;
  if(rec){
    const [key, side, k] = rec.split(":");
    match()[key][side][+k] = e.target.value;
    save();
  }
});
document.addEventListener("change", e=>{ if(e.target.id==="roomid"){ save(); render(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="roomid"){ e.target.blur(); render(); } });

const restored = load();
S = restored && restored.screen ? restored : blankState();
render();
</script>
